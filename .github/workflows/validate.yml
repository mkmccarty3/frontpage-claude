name: Validate plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate with the tested Anthropic CLI
        run: npx --yes @anthropic-ai/claude-code@2.1.218 plugin validate --strict .
