  <rect width="64" height="64" rx="12" ry="12" fill="#0f1419"/>
  <!-- Stylized F: top bar + mid bar + descender, in warm off-white -->
  <path
    d="M18 14
       h28
       v8
       h-20
       v8
       h16
       v8
       h-16
       v16
       h-8
       z"
    fill="#f5f5f4"
  />
</svg>
