<!--
  Frontpage icon mark — Phase 2.6.A T.6 (interim, refined in B.3).
  A rounded square in deep neutral with a stylized "F" cut out.
  Used as favicon (SVG), apple-touch-icon source, and OG fallback image.
  64×64 viewBox keeps math simple; SVG scales to any rendered size.
-->
